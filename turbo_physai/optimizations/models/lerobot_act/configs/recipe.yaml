schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.lerobot_act.reference
  version: '1.0.0'
  description: LeRobot ACT optimizations
model:
  name: LeRobot-ACT
optimization_modules:
  - turbo_physai.optimizations.models.lerobot_act.catalog
optimization_groups:
  - id: lerobot_act.reference_channels_last
    enabled: true
    options:
      pool_backward_gather: true
  - id: lerobot_act.reference_backbone_compile
    enabled: true
  - id: lerobot_act.reference_no_attn_average
    enabled: true
  - id: lerobot_act.reference_ffn_compile
    enabled: true
  - id: lerobot_act.reference_attention_probs
    enabled: true
    options:
      register_backward: true
  - id: lerobot_act.reference_ddp
    enabled: true
    options:
      static_graph: true
  - id: lerobot_act.reference_nonblocking_h2d
    enabled: true
  - id: lerobot_act.reference_async_scalars
    enabled: true
    options:
      deferred_metrics: true
      layernorm_apex: true
  - id: lerobot_act.sampler_vector
    enabled: true
  - id: lerobot_act.vae_no_clone
    enabled: true
  - id: lerobot_act.apex_fused_adamw
    enabled: true
  - id: lerobot_act.pool_backward_gather
    enabled: true
