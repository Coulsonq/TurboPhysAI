schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.lerobot_act.hcu
  version: "1.0.0"
  description: LeRobot ACT HCU performance configuration
model:
  name: LeRobot-ACT
optimization_modules:
  - turbo_physai.optimizations.models.lerobot_act.catalog
  - turbo_physai.optimizations.models.lerobot_act.compile_regions_catalog
optimization_groups:
  - id: lerobot_act.ddp_find_unused
    enabled: true
    options:
      static_graph: true
      broadcast_buffers: false
  - id: lerobot_act.nonblocking_h2d
    enabled: true
  - id: lerobot_act.channels_last_backbone_compile
    enabled: true
  - id: lerobot_act.sampler_vector
    enabled: true
  - id: lerobot_act.ffn_backward_fusion
    enabled: true
    options:
      qk_projection: true
  - id: lerobot_act.attention_compile
    enabled: true
  - id: lerobot_act.pool_backward_gather
    enabled: true
    options:
      vae_no_clone: true
  - id: lerobot_act.layernorm_apex_backward
    enabled: true
  - id: lerobot_act.apex_fused_adamw
    enabled: true
  - id: lerobot_act.encoder_regions_compile
    enabled: true
    options:
      main_encoder: true
      vae_encoder: true
  - id: lerobot_act.decoder_region_compile
    enabled: true
  - id: lerobot_act.ffn_region_compile
    enabled: true
