schema_version: turbophysai/optimization-config/v1
kind: OptimizationConfig
metadata:
  id: model.alpamayo2.hcu
  version: "0.1.0"
  description: Alpamayo 2 Super Stage 1 HCU optimizations
model:
  name: alpamayo2
optimization_modules:
  - turbo_physai.optimizations.models.alpamayo2.catalog
extends: []
compatibility: {}
optimization_groups:
  - id: alpamayo2.dataloader_workers_omp
    enabled: true
    options:
      num_workers: 2
      omp_num_threads: 4
  - id: alpamayo2.flash_attention
    enabled: true
  - id: alpamayo2.non_blocking_h2d
    enabled: true
  - id: alpamayo2.disable_cpu_offload
    enabled: true
